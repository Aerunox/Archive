<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>漫画阅读感图标 · 彩色版与应用图标效果</title>
<style>
body { background:#fff; font-family:'Microsoft YaHei',sans-serif; margin:16px; }
h2 { font-size:15px; color:#333; margin:14px 0 6px; border-left:4px solid #e8590c; padding-left:8px; }
.sub { font-size:12px; color:#666; margin:2px 0 8px; }
.row { display:flex; gap:14px; margin-bottom:10px; flex-wrap:wrap; }
.cell { width:196px; text-align:center; border:1px solid #e0e0e0; border-radius:10px; padding:14px 8px 10px; background:#fafafa; }
.glyph { background:#fffdf8; border-radius:10px; padding:14px 0; }
.glyph svg { width:120px; height:120px; display:block; margin:0 auto; }
.mocks { display:flex; gap:8px; justify-content:center; margin-top:10px; }
.mock { width:96px; height:96px; border-radius:22%; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.14); }
.mock svg { width:56px; height:56px; }
.m1 { background:linear-gradient(135deg,#FFB020,#E8590C); }
.m2 { background:linear-gradient(135deg,#2DD4BF,#0F766E); }
.cell .n { font-size:12px; color:#222; margin-top:8px; font-weight:600; }
.cell .d { font-size:11px; color:#777; }
.cell .l { font-size:11px; color:#0a7d33; font-weight:600; }
.pal { display:flex; gap:10px; flex-wrap:wrap; margin:8px 0 4px; }
.pal .p { width:130px; border:1px solid #e0e0e0; border-radius:8px; padding:8px; text-align:center; }
.pal .p .sw { height:34px; border-radius:6px; margin-bottom:6px; }
.pal .p .t { font-size:11px; color:#555; }
</style>
</head>
<body>
<h2 style="border-left-color:#333;">配色方案</h2>
<div class="sub">三套可选主色（Android 自适应图标最终只用一套；以下预览展示两套渐变效果）</div>
<div class="pal">
  <div class="p"><div class="sw" style="background:#EA580C;"></div><div class="t">主橙 #EA580C · 漫画活力感</div></div>
  <div class="p"><div class="sw" style="background:linear-gradient(135deg,#FFB020,#E8590C);"></div><div class="t">橙金渐变 · 默认推荐</div></div>
  <div class="p"><div class="sw" style="background:linear-gradient(135deg,#2DD4BF,#0F766E);"></div><div class="t">深海青渐变 · 典藏清爽感</div></div>
  <div class="p"><div class="sw" style="background:#222;"></div><div class="t">深墨黑字形 · 简约备选</div></div>
</div>

const groups = [
 ['漫画对话框（漫画信号最强）', ['mdi-comic-bubble','mdi-thought-bubble','iconoir-chat-bubble']],
 ['开卷 · 翻页（阅读器通用语言）', ['mdi-book-open-page','lucide-book-open','ph-book-open','ri-book-open']],
 ['书堆 · 卷宗（归档 + 阅读兼备）', ['mdi-book-multiple','ri-book-stack','iconoir-book-stack','ph-books']],
 ['书签 · 典藏', ['tabler-bookmarks','mdi-book-open-variant']],
];
const grid = document.getElementById('grid');
for (const [title, keys] of groups) {
  const h = document.createElement('h2'); h.textContent = title; grid.appendChild(h);
  const row = document.createElement('div'); row.className = 'row';
  for (const k of keys) {
    const it = I[k]; if (!it) continue;
    const div = document.createElement('div'); div.className = 'cell';
    const g = document.createElement('div'); g.className = 'glyph'; g.innerHTML = it.orange; div.appendChild(g);
    const m = document.createElement('div'); m.className = 'mocks';
    const m1 = document.createElement('div'); m1.className = 'mock m1'; m1.innerHTML = it.white;
    const m2 = document.createElement('div'); m2.className = 'mock m2'; m2.innerHTML = it.white;
    m.appendChild(m1); m.appendChild(m2);
    div.appendChild(m);
    const n = document.createElement('div'); n.className='n'; n.textContent = META[k][1];
    const d = document.createElement('div'); d.className='d'; d.textContent = META[k][0];

    row.appendChild(div);
  }
  grid.appendChild(row);
}
