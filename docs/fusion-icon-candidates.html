<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Archive 融合图标候选（爪印 × 档案/书/漫画）</title>
<style>
body { background:#fff; font-family:'Microsoft YaHei',sans-serif; margin:16px; }
h2 { font-size:15px; color:#333; margin:14px 0 6px; border-left:4px solid #e8590c; padding-left:8px; }
.row { display:flex; gap:14px; margin-bottom:10px; flex-wrap:wrap; }
.cell { width:236px; text-align:center; border:1px solid #e0e0e0; border-radius:10px; padding:14px 8px 10px; background:#fafafa; }
.glyph { background:#fffdf8; border-radius:10px; padding:14px 0; }
.glyph svg { width:120px; height:120px; display:block; margin:0 auto; }
.mocks { display:flex; gap:8px; justify-content:center; margin-top:10px; }
.mock { width:96px; height:96px; border-radius:22%; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.14); }
.mock svg { width:60px; height:60px; }
.m1 { background:linear-gradient(135deg,#FFB020,#E8590C); }
.m2 { background:linear-gradient(135deg,#2DD4BF,#0F766E); }
.m3 { background:#2B2B2B; }
.cell .n { font-size:12px; color:#222; margin-top:8px; font-weight:600; }
.cell .d { font-size:11px; color:#777; }
.cell .l { font-size:11px; color:#0a7d33; font-weight:600; }
</style>
</head>
<body>
<h2>融合方案说明</h2>
