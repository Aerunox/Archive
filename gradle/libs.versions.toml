# Archive dependency versions.
# All versions verified against Maven Central / Google Maven on 2026-10-06.
# Miuix (top.yukonga.miuix.kmp) is experimental upstream; the version is pinned
# deliberately and must be bumped consciously after checking their changelog.

[versions]
agp = "9.4.1"
kotlin = "2.3.21"
ksp = "2.3.12"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
navigationCompose = "2.10.2"
room = "2.8.5"
paging = "3.5.1"
datastore = "1.2.1"
work = "2.12.0"
hilt = "2.60.1"
androidxHilt = "1.4.0"
coil = "3.6.3"
retrofit = "3.0.0"
okhttp = "5.5.0"
kotlinxSerialization = "1.11.0"
coroutines = "1.11.0"
media3 = "1.11.1"
zoomable = "2.16.0"
desugar = "2.1.5"
miuix = "0.9.4"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
