name: Release APK

# 推送 v* 标签时自动构建 release APK 并附加到对应 Release；
# 也支持在 Actions 页手动触发（手动触发只构建，不发布，产物在 Artifacts 下载）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # 项目用 debug 签名打 release 包（见 app/build.gradle.kts 的 debugSign）。
      # CI 上没有现成 keystore，这里按同样的别名/密码生成一个，保证脚本零改动可跑。
      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APKs
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APKs as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ github.ref_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APKs to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
